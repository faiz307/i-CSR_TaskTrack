<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073ab7">
<title>i-CSR TaskTrack 2026</title><style>
:root{--blue:#073ab7;--teal:#04a6a6;--green:#1b9a59;--ink:#12213a;--muted:#60708a;--bg:#f3f7fb;--line:#dce5ef;--danger:#c93434}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--blue),#075fcb 58%,var(--teal));color:#fff;padding:18px 18px 14px;position:sticky;top:0;z-index:5;box-shadow:0 5px 20px #073ab733}.head{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:21px}.sub{font-size:12px;opacity:.9}.sync{border:0;border-radius:999px;background:#fff;color:var(--ink);padding:8px 11px;font-weight:700}.nav{max-width:1100px;margin:10px auto 0;display:flex;gap:7px}.nav button{flex:1;border:0;border-radius:10px;padding:10px;color:#fff;background:#ffffff20;font-weight:800}.nav button.active{background:#fff;color:var(--blue)}main{max-width:1100px;margin:auto;padding:18px 14px 70px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:0 5px 16px #17314c0a}.metric strong{display:block;font-size:30px;margin-top:7px}.muted,.subtitle{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.bar{height:10px;background:#eaf0f6;border-radius:20px;overflow:hidden;margin-top:10px}.fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green))}.phase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.phase-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:22px;text-align:left;color:var(--ink)}.phase-card strong{display:block;font-size:18px}.phase-card small,.phase-card span{display:block;margin-top:7px;color:var(--muted)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 13px;font-weight:800}.small{padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:9px}.task{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:9px}.task-title{font-weight:700;line-height:1.45;flex:1}.tick{display:flex;gap:7px;align-items:center;white-space:nowrap;font-weight:700}.tick input{width:21px;height:21px;accent-color:var(--green)}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd9e5;border-radius:9px;background:#fff}textarea{min-height:100px;resize:vertical}.toolbar{display:grid;grid-template-columns:1fr 190px;gap:9px;margin-bottom:12px}.back{border:0;background:none;color:var(--blue);font-weight:800;padding:5px 0 12px}.note{background:#f1f8f8;border-left:4px solid var(--teal);padding:10px;margin-top:8px;white-space:pre-wrap}dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);box-shadow:0 24px 80px #0004}dialog::backdrop{background:#05152a99}.modal{padding:20px}.modal label{display:block;font-weight:800;margin:13px 0 6px}.empty{text-align:center;color:var(--muted);padding:26px}.error{color:var(--danger)}.login{max-width:470px;margin:60px auto}.login h2{margin-top:0}.phase-tag{font-size:11px;padding:3px 7px;border-radius:999px;background:#e8f7f5;color:#087a74}.report-filter{max-width:360px;margin-bottom:12px}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.phase-grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.row.task-row{align-items:flex-start;flex-direction:column}.brand{font-size:18px}.nav button{font-size:13px}.sync{font-size:0}.sync span{font-size:13px}}
</style></head><body>
<header><div class="head"><div><div class="brand">i-CSR TaskTrack 2026</div><div class="sub">8 Disember 2026 · UiTM Cawangan Perak</div></div><button id="syncBtn" class="sync" title="Segar Semula"><span>🟠 Offline</span> · Segar Semula</button></div><nav class="nav"><button data-page="dashboard" class="active">Dashboard</button><button data-page="portfolio">Portfolio</button><button data-page="report">Laporan</button></nav></header>
<main><section id="app"><div id="dashboard"></div><div id="portfolio" class="hidden"></div><div id="report" class="hidden"></div></section></main>
<dialog id="modal"><div class="modal"><div class="row"><h3 id="modalTitle"></h3><button class="small" onclick="modal.close()">✕</button></div><div id="modalBody"></div><div class="actions"><button id="modalSave" class="primary">Simpan</button><button class="small" onclick="modal.close()">Batal</button></div></div></dialog>
<script>
const CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbwp5cWjLl0W-WzP5qbR4eHOArouFasxW7ctKoIfaP_OJ9vYOHIdGHhLt51dNpwRcty8/exec',REFRESH_MS:30000};
const PHASES=['SEBELUM','SEMASA','SELEPAS'];let state={portfolios:[],tasks:[]},page='dashboard',selected=null,selectedPhase=null,editing=false,timer=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(kind,text){$('syncBtn').querySelector('span').textContent=({connected:'🟢 Connected',syncing:'🔵 Syncing',offline:'🟠 Offline',error:'🔴 Error'})[kind]||text;text&&($('syncBtn').title=text)}
async function api(action,payload={}){if(!CONFIG.API_URL.startsWith('https://script.google.com/'))throw Error('URL backend belum dikonfigurasi.');status('syncing');const body={action,...payload};let res;try{res=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});}catch(e){status(navigator.onLine?'error':'offline');throw e}let json;try{json=await res.json()}catch(e){status('error');throw Error('Respons backend tidak sah. Semak URL /exec dan kebenaran deployment.')}if(!json.ok){status('error');throw Object.assign(Error(json.error||'Operasi gagal.'),{code:json.code,latest:json.latest})}status('connected');return json.data}
async function load(force=false){if(editing&&!force)return;try{const data=await api('readAll');state={portfolios:data.portfolios,tasks:data.tasks};render();clearInterval(state.timer);state.timer=setInterval(()=>load(false),CONFIG.REFRESH_MS)}catch(e){if(force)alert(e.message)}}
const portfolio=id=>state.portfolios.find(p=>p.portfolio_id===id);const tasksFor=id=>state.tasks.filter(t=>t.portfolio_id===id);function totals(id,phase){let a=state.tasks.filter(t=>(!id||t.portfolio_id===id)&&(!phase||t.phase===phase));return {all:a.length,done:a.filter(t=>t.completed).length,not:a.filter(t=>!t.completed).length}}function pct(id,phase){let t=totals(id,phase);return t.all?Math.round(t.done/t.all*100):0}const bar=v=>`<div class="bar"><div class="fill" style="width:${v}%"></div></div>`;
function setPage(next){page=next;selected=null;selectedPhase=null;render()}function render(){['dashboard','portfolio','report'].forEach(id=>$(id).classList.toggle('hidden',id!==page));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({dashboard:renderDashboard,portfolio:renderPortfolio,report:renderReport})[page]();}
function renderDashboard(){let t=totals();$('dashboard').innerHTML=`<h2>Dashboard</h2><div class="grid"><div class="card metric"><span class="muted">Jumlah Tugasan</span><strong>${t.all}</strong></div><div class="card metric"><span class="muted">Selesai</span><strong>${t.done}</strong></div><div class="card metric"><span class="muted">Belum Selesai</span><strong>${t.not}</strong></div><div class="card metric"><span class="muted">Kemajuan</span><strong>${pct()}%</strong></div></div><div class="card"><div class="row"><strong>Kemajuan keseluruhan</strong><strong>${t.done}/${t.all}</strong></div>${bar(pct())}</div><h3>Kemajuan Portfolio</h3>${state.portfolios.map(p=>`<div class="card" role="button" tabindex="0" onclick="openPortfolio('${p.portfolio_id}')"><div class="row"><div><strong>${esc(p.portfolio_name)}</strong><div class="subtitle">${esc(p.members||'Belum ditetapkan')}</div><div class="subtitle">${totals(p.portfolio_id).done}/${totals(p.portfolio_id).all} selesai</div></div><strong>${pct(p.portfolio_id)}% ›</strong></div>${bar(pct(p.portfolio_id))}</div>`).join('')}`}
function openPortfolio(id){selected=id;selectedPhase=null;page='portfolio';render()}function renderPortfolio(){let root=$('portfolio');if(!selected){root.innerHTML=`<h2>Portfolio AJK</h2><input id="portfolioSearch" placeholder="Cari portfolio atau nama AJK…" oninput="filterPortfolios(this.value)"><div id="portfolioList">${portfolioCards('')}</div>`;return}let p=portfolio(selected);if(!p){selected=null;return render()}root.innerHTML=`<button class="back" onclick="selected=null;selectedPhase=null;render()">← Semua portfolio</button><div class="card"><h2>${esc(p.portfolio_name)}</h2><div class="subtitle">Pengerusi: ${esc(p.chairperson||'Belum ditetapkan')}</div><div class="subtitle">AJK: ${esc(p.members||'Belum ditetapkan')}</div><div class="row"><span>${totals(selected).done}/${totals(selected).all} selesai</span><strong>${pct(selected)}%</strong></div>${bar(pct(selected))}</div>${selectedPhase?phaseTasks(p):`<h3>Pilih Fasa Tugasan</h3><div class="phase-grid">${PHASES.map(ph=>`<button class="phase-card" onclick="selectedPhase='${ph}';render()"><strong>${ph}</strong><small>${totals(selected,ph).all} tugasan</small><span>${pct(selected,ph)}% selesai →</span></button>`).join('')}</div>`}`}
function portfolioCards(q){q=q.toLowerCase();return state.portfolios.filter(p=>(p.portfolio_name+' '+p.members).toLowerCase().includes(q)).map(p=>`<div class="card" onclick="openPortfolio('${p.portfolio_id}')"><div class="row"><div><strong>${esc(p.portfolio_name)}</strong><div class="subtitle">${esc(p.members||'Belum ditetapkan')}</div></div><strong>${pct(p.portfolio_id)}% ›</strong></div>${bar(pct(p.portfolio_id))}</div>`).join('')||'<div class="empty">Tiada portfolio ditemui.</div>'}function filterPortfolios(q){$('portfolioList').innerHTML=portfolioCards(q)}
function phaseTasks(p){return `<button class="back" onclick="selectedPhase=null;render()">← Pilih fasa</button><div class="row"><h3>Tugasan ${selectedPhase}</h3><button class="primary" onclick="taskDialog()">+ Tambah Tugasan</button></div><div class="toolbar"><input id="taskSearch" placeholder="Cari tugasan…" oninput="filterTaskList()"><select id="taskStatus" onchange="filterTaskList()"><option value="">Semua status</option><option value="open">Belum Selesai</option><option value="done">Selesai</option></select></div><div id="taskList">${taskCards('','')}</div>`}
function taskCards(q='',f=''){q=q.toLowerCase();let rows=state.tasks.filter(t=>t.portfolio_id===selected&&t.phase===selectedPhase&&t.task_description.toLowerCase().includes(q)&&(!f||(f==='done')===t.completed));return rows.map(t=>`<article class="task"><div class="row task-row"><div class="task-title">${esc(t.task_description)}</div><label class="tick"><input type="checkbox" ${t.completed?'checked':''} onchange="toggleStatus('${t.task_id}',this.checked)"><span>${t.completed?'Selesai':'Belum Selesai'}</span></label></div><div class="actions"><button class="small" onclick="noteDialog('${t.task_id}')">Catatan${t.notes?' ✓':''}</button><button class="small" onclick="taskDialog('${t.task_id}')">Edit Tugasan</button></div>${t.notes?`<div class="note">${esc(t.notes)}</div>`:''}</article>`).join('')||'<div class="empty">Tiada tugasan untuk fasa ini.</div>'}function filterTaskList(){$('taskList').innerHTML=taskCards($('taskSearch').value,$('taskStatus').value)}
async function toggleStatus(id,value){let t=state.tasks.find(x=>x.task_id===id);try{let updated=await api('updateTask',{task_id:id,version:t.version,changes:{completed:value}});Object.assign(t,updated);render()}catch(e){alert(e.code==='VERSION_CONFLICT'?'Tugasan telah dikemas kini oleh pengguna lain. Data akan disegar semula.':e.message);await load(true)}}
function dialog(title,body,save){editing=true;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalSave').onclick=async()=>{try{await save();modal.close();editing=false;render()}catch(e){alert(e.code==='VERSION_CONFLICT'?'Versi baharu ditemui. Segar semula sebelum mencuba lagi.':e.message)}};modal.onclose=()=>{editing=false};modal.showModal()}
function taskDialog(id){let t=id?state.tasks.find(x=>x.task_id===id):null;dialog(t?'Edit Tugasan':'Tambah Tugasan',`<label>Perihal tugasan</label><textarea id="taskText" maxlength="1500">${esc(t?.task_description||'')}</textarea>`,async()=>{let text=$('taskText').value.trim();if(!text)throw Error('Masukkan perihal tugasan.');let updated=t?await api('updateTask',{task_id:t.task_id,version:t.version,changes:{task_description:text}}):await api('createTask',{portfolio_id:selected,phase:selectedPhase,task_description:text});if(t)Object.assign(t,updated);else state.tasks.push(updated)})}
function noteDialog(id){let t=state.tasks.find(x=>x.task_id===id);dialog('Catatan',`<label>Catatan tugasan</label><textarea id="noteText" maxlength="5000">${esc(t.notes||'')}</textarea>`,async()=>Object.assign(t,await api('updateTask',{task_id:id,version:t.version,changes:{notes:$('noteText').value.trim()}})))}
function renderReport(){let filter=$('reportPortfolio')?.value||'';let ps=filter?state.portfolios.filter(p=>p.portfolio_id===filter):state.portfolios;let t=totals(filter||null);$('report').innerHTML=`<div class="row"><h2>Laporan</h2><button class="primary small" onclick="copyReport()">Salin Laporan</button></div><select id="reportPortfolio" class="report-filter" onchange="renderReport()"><option value="">Semua portfolio</option>${state.portfolios.map(p=>`<option value="${p.portfolio_id}" ${filter===p.portfolio_id?'selected':''}>${esc(p.portfolio_name)}</option>`).join('')}</select><div class="card"><div class="row"><strong>Keseluruhan</strong><strong>${pct(filter||null)}%</strong></div><p>${t.done} selesai · ${t.not} belum selesai · ${t.all} jumlah</p>${bar(pct(filter||null))}</div>${ps.map(p=>`<div class="card"><div class="row"><strong>${esc(p.portfolio_name)}</strong><strong>${pct(p.portfolio_id)}%</strong></div>${bar(pct(p.portfolio_id))}${PHASES.map(ph=>{let s=totals(p.portfolio_id,ph);return `<div class="row" style="margin-top:10px"><span><span class="phase-tag">${ph}</span> ${s.done}/${s.all} selesai</span><strong>${pct(p.portfolio_id,ph)}%</strong></div>`}).join('')}<details><summary style="margin-top:12px">Lihat tugasan</summary>${tasksFor(p.portfolio_id).map(t=>`<div class="task"><div>${t.completed?'☑':'☐'} ${esc(t.task_description)}</div>${t.notes?`<div class="note">${esc(t.notes)}</div>`:''}</div>`).join('')}</details></div>`).join('')}`}
function reportText(){let f=$('reportPortfolio')?.value||'';let ps=f?state.portfolios.filter(p=>p.portfolio_id===f):state.portfolios,t=totals(f||null),lines=['LAPORAN KEMAJUAN i-CSR 2026','Tarikh persidangan: 8 Disember 2026',`Kemajuan: ${pct(f||null)}% (${t.done}/${t.all} selesai)`,''];ps.forEach(p=>{let s=totals(p.portfolio_id);lines.push(`${p.portfolio_name}: ${pct(p.portfolio_id)}% (${s.done}/${s.all})`);PHASES.forEach(ph=>{let x=totals(p.portfolio_id,ph);lines.push(`  ${ph}: ${x.done}/${x.all} selesai`)});});return lines.join('\n')}async function copyReport(){let text=reportText();try{await navigator.clipboard.writeText(text);alert('Laporan telah disalin.')}catch{dialog('Salin Laporan',`<textarea id="copyText">${esc(text)}</textarea>`,async()=>{});$('copyText').select()}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('syncBtn').onclick=()=>load(true);window.addEventListener('online',()=>status('connected'));window.addEventListener('offline',()=>status('offline'));load(true);
</script></body></html>

<script>
const CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbwp5cWjLl0W-WzP5qbR4eHOArouFasxW7ctKoIfaP_OJ9vYOHIdGHhLt51dNpwRcty8/exec',REGISTRATION_CSV:'https://docs.google.com/spreadsheets/d/1tuiGzUAG0-VAtOwncKuaF1BLU1zAmgDrDfFyFjqRnVU/gviz/tq?tqx=out:csv&sheet=Form%20Responses%201',REGISTRATION_SHEET:'https://docs.google.com/spreadsheets/d/1tuiGzUAG0-VAtOwncKuaF1BLU1zAmgDrDfFyFjqRnVU/edit',REFRESH_MS:30000};
const SCHEDULE=[['26 Ogos 2026','Hebahan dan panggilan kertas kerja bermula','Poster, Publisiti, Urus Setia'],['September – 14 November 2026','Promosi, penerimaan kertas penuh, penajaan, pelantikan penceramah dan juri serta semakan laman dwibahasa','Publisiti, Penerbitan, Penajaan, Protokol, Teknikal'],['15 November 2026','Tarikh akhir penghantaran kertas penuh','Penerbitan, Pendaftaran'],['16–20 November 2026','Semakan kelengkapan, penilaian awal dan makluman penerimaan','Penerbitan, Urus Setia'],['20 November 2026','Tarikh akhir penghantaran video pembentangan','Pembentangan, Teknikal'],['20–27 November 2026','Pembetulan yang diperlukan dan pembayaran selepas penerimaan','Penerbitan, Bendahari, Pendaftaran'],['21–30 November 2026','Penyediaan video prarakam, jadual sesi, moderator, rubrik, juri dan penilaian awal video','Pembentangan, Penjurian, Teknikal'],['27 November 2026','Tarikh akhir pembayaran yuran','Bendahari, Pendaftaran'],['1–6 Disember 2026','Pengesahan pembayaran, penyediaan e-buku program, skrip pengacara, paparan anugerah dan ujian teknikal','Pendaftaran, Bendahari, Pembentangan, Protokol, Teknikal'],['7 Disember 2026','Raptai akhir dan persediaan sekretariat','Protokol, Logistik, Teknikal, Semua Ketua'],['8 Disember 2026','🎯 HARI PERSIDANGAN i-CSR2026','Semua AJK'],['9–15 Disember 2026','Rekod kehadiran, e-sijil, penghargaan, laporan penjurian dan penyelarasan kewangan','Pendaftaran, Poster, Setiausaha, Bendahari, Penjurian'],['Disember 2026 – Januari 2027','Semakan manuskrip, permohonan e-ISBN, penerbitan e-prosiding, laporan akhir dan arkib','Penerbitan, Bahasa, Setiausaha, Bendahari']];
const PHASES=['SEBELUM','SEMASA','SELEPAS'];let state={portfolios:[],tasks:[],registration:[],registrationLoaded:null,registrationError:''},page='registration',selected=null,selectedPhase=null,editing=false,timer=null,connection={connected:false,failures:0};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(kind,text){const value=({connected:'🟢 Aktif',offline:'🟠 Offline',error:'🔴 Gangguan'})[kind];if(value&&$('syncBtn').querySelector('span').textContent!==value)$('syncBtn').querySelector('span').textContent=value;text&&($('syncBtn').title=text)}
function syncStart(){}
function syncSuccess(){connection.connected=true;connection.failures=0;status('connected','Data terkini berjaya disegerakkan.')}
function syncFailure(){connection.failures++;if(!navigator.onLine){connection.connected=false;status('offline','Tiada sambungan internet.')}else if(connection.failures>=5){connection.connected=false;status('error','Penyegerakan gagal lima kali berturut-turut. Tekan untuk cuba lagi.')}else{$('syncBtn').title='Data terakhir masih dipaparkan; cubaan latar '+connection.failures+' daripada 5 gagal.'}}
async function api(action,payload={}){if(!CONFIG.API_URL.startsWith('https://script.google.com/'))throw Error('URL backend belum dikonfigurasi.');syncStart();const body={action,...payload};let res;try{res=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});}catch(e){syncFailure();throw e}let json;try{json=await res.json()}catch(e){syncFailure();throw Error('Respons backend tidak sah. Semak URL /exec dan kebenaran deployment.')}if(!json.ok){syncSuccess();throw Object.assign(Error(json.error||'Operasi gagal.'),{code:json.code,latest:json.latest})}syncSuccess();return json.data}
async function load(force=false){if(editing&&!force)return;try{const data=await api('readAll');state.portfolios=data.portfolios;state.tasks=data.tasks;render()}catch(e){if(force&&connection.failures>=3)alert(e.message)}}
const portfolio=id=>state.portfolios.find(p=>p.portfolio_id===id);const tasksFor=id=>state.tasks.filter(t=>t.portfolio_id===id);function totals(id,phase){let a=state.tasks.filter(t=>(!id||t.portfolio_id===id)&&(!phase||t.phase===phase));return {all:a.length,done:a.filter(t=>t.completed).length,not:a.filter(t=>!t.completed).length}}function pct(id,phase){let t=totals(id,phase);return t.all?Math.round(t.done/t.all*100):0}const bar=v=>`<div class="bar"><div class="fill" style="width:${v}%"></div></div>`;
function setPage(next){page=next;selected=null;selectedPhase=null;render();if(next==='registration'&&!state.registrationLoaded)loadRegistration()}function render(){['registration','schedule','portfolio','report'].forEach(id=>$(id).classList.toggle('hidden',id!==page));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({registration:renderRegistration,schedule:renderSchedule,portfolio:renderPortfolio,report:renderReport})[page]();}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}return rows}
async function loadRegistration(){state.registrationError='';if(page==='registration')$('registration').innerHTML='<div class="card empty">Memuatkan data pendaftaran langsung…</div>';try{let res=await fetch(CONFIG.REGISTRATION_CSV,{cache:'no-store'});if(!res.ok)throw Error('Google Sheets tidak dapat dicapai.');let rows=parseCSV(await res.text());state.registration=rows.slice(1).filter(r=>r.some(Boolean)).map(r=>({timestamp:r[0]||'',name:r[1]||'',institution:r[2]||'',type:r[5]||'',category:r[6]||'',title:r[7]||'',area:r[8]||'',paper:r[9]||'',turnitin:r[11]||''}));state.registrationLoaded=new Date();if(page==='registration')renderRegistration()}catch(e){state.registrationError=e.message;if(page==='registration')renderRegistration()}}
const uniq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y));function regFiltered(){let q=($('regSearch')?.value||'').trim().toLowerCase(),type=$('regType')?.value||'',cat=$('regCategory')?.value||'',area=$('regArea')?.value||'';return state.registration.filter(r=>(!q||(r.name+' '+r.institution+' '+r.title).toLowerCase().includes(q))&&(!type||r.type===type)&&(!cat||r.category===cat)&&(!area||r.area===area))}function groupCount(rows,key){let m={};rows.forEach(r=>{let v=r[key]||'Tidak dinyatakan';m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}function chartRows(items,total){return items.map(([label,value])=>`<div class="chart-row"><div class="chart-label"><span>${esc(label)}</span><strong>${value}</strong></div><div class="chart-track"><div class="chart-value" style="width:${total?Math.max(3,value/total*100):0}%"></div></div></div>`).join('')||'<div class="empty">Tiada data</div>'}
function renderRegistration(){let root=$('registration');if(state.registrationError){root.innerHTML=`<div class="reg-head"><div><h2>Dashboard Pendaftaran</h2><p class="subtitle">Data daripada Google Sheets.</p></div><button class="primary" onclick="loadRegistration()">Cuba Lagi</button></div><div class="card error">${esc(state.registrationError)}</div>`;return}if(!state.registrationLoaded){root.innerHTML='<div class="card empty">Memuatkan data pendaftaran…</div>';return}let old={q:$('regSearch')?.value||'',type:$('regType')?.value||'',cat:$('regCategory')?.value||'',area:$('regArea')?.value||''},all=state.registration,types=uniq(all.map(r=>r.type)),cats=uniq(all.map(r=>r.category)),areas=uniq(all.map(r=>r.area));root.innerHTML=`<div class="reg-head"><div><h2>Dashboard Pendaftaran</h2><div class="live-pill">● Sumber Google Sheets</div><p class="subtitle">Paparan agregat dan senarai operasi tanpa e-mel atau nombor telefon. Tekan Sync untuk mendapatkan data terkini.</p></div><div class="actions"><button class="small" onclick="clearRegistrationFilters()">Reset penapis</button><button class="primary" onclick="loadRegistration()">Sync</button></div></div><div class="reg-filters"><input id="regSearch" value="${esc(old.q)}" placeholder="Cari nama, institusi atau tajuk…" oninput="updateRegistrationView()"><select id="regType" onchange="updateRegistrationView()"><option value="">Semua penyertaan</option>${types.map(v=>`<option ${old.type===v?'selected':''}>${esc(v)}</option>`).join('')}</select><select id="regCategory" onchange="updateRegistrationView()"><option value="">Semua kategori</option>${cats.map(v=>`<option ${old.cat===v?'selected':''}>${esc(v)}</option>`).join('')}</select><select id="regArea" onchange="updateRegistrationView()"><option value="">Semua bidang</option>${areas.map(v=>`<option ${old.area===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div id="regView"></div><div class="reg-source">Kemas kini terakhir: ${state.registrationLoaded.toLocaleString('ms-MY')} · <a href="${CONFIG.REGISTRATION_SHEET}" target="_blank" rel="noopener">Buka sumber Google Sheets</a></div>`;updateRegistrationView()}
function updateRegistrationView(){let rows=regFiltered(),presenters=rows.filter(r=>/presenter/i.test(r.type)).length,participants=rows.filter(r=>/participant/i.test(r.type)&&!/presenter/i.test(r.type)).length,papers=rows.filter(r=>r.paper).length,institutions=uniq(rows.map(r=>r.institution)).length;let latest=rows.slice().sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0]?.timestamp||'—';$('regView').innerHTML=`<div class="grid"><div class="card metric"><span class="muted">Jumlah Pendaftaran</span><strong>${rows.length}</strong></div><div class="card metric"><span class="muted">Pembentang</span><strong>${presenters}</strong></div><div class="card metric"><span class="muted">Peserta</span><strong>${participants}</strong></div><div class="card metric"><span class="muted">Institusi</span><strong>${institutions}</strong></div></div><div class="reg-layout"><div class="card"><div class="row"><strong>Mengikut kategori</strong><span class="muted">${rows.length} rekod</span></div>${chartRows(groupCount(rows,'category'),rows.length)}</div><div class="card"><div class="row"><strong>Mengikut bidang</strong><span class="muted">${papers} kertas dimuat naik</span></div>${chartRows(groupCount(rows,'area'),rows.length)}</div></div><div class="card"><div class="row"><strong>Senarai pendaftaran</strong><span class="muted">Terbaharu: ${esc(latest)}</span></div><div class="reg-table-wrap"><table class="reg-table"><thead><tr><th>Tarikh</th><th>Nama / Penulis</th><th>Institusi</th><th>Jenis</th><th>Kategori</th><th>Bidang / Tajuk</th></tr></thead><tbody>${rows.slice().sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).map(r=>`<tr><td>${esc(r.timestamp)}</td><td><strong>${esc(r.name)}</strong></td><td>${esc(r.institution)}</td><td><span class="reg-badge ${/participant/i.test(r.type)&&!/presenter/i.test(r.type)?'participant':''}">${esc(r.type)}</span></td><td>${esc(r.category)}</td><td>${esc(r.area)}${r.title&&r.title.toUpperCase()!=='NA'?`<div class="subtitle">${esc(r.title)}</div>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Tiada rekod sepadan.</td></tr>'}</tbody></table></div></div>`}
function clearRegistrationFilters(){['regSearch','regType','regCategory','regArea'].forEach(id=>{if($(id))$(id).value=''});updateRegistrationView()}
function renderSchedule(){$('schedule').innerHTML=`<h2>Paparan Garis Masa Induk</h2><p class="subtitle">Garis masa pelaksanaan i-CSR2026 dan jawatankuasa yang bertanggungjawab.</p><div class="master-timeline">${SCHEDULE.map(r=>`<article class="timeline-item ${r[0]==='8 Disember 2026'?'conference':''}"><span class="timeline-dot" aria-hidden="true"></span><div class="timeline-card"><div class="timeline-date">${esc(r[0])}</div><div class="timeline-activity">${esc(r[1])}</div><div class="timeline-team"><strong>AJK:</strong><span>${esc(r[2])}</span></div></div></article>`).join('')}</div>`}
function openPortfolio(id){selected=id;selectedPhase=null;page='portfolio';render()}function renderPortfolio(){let root=$('portfolio');if(!selected){root.innerHTML=`<h2>Portfolio AJK</h2><input id="portfolioSearch" placeholder="Cari portfolio atau nama AJK…" oninput="filterPortfolios(this.value)"><div id="portfolioList">${portfolioCards('')}</div>`;return}let p=portfolio(selected);if(!p){selected=null;return render()}root.innerHTML=`<button class="back" onclick="selected=null;selectedPhase=null;render()">← Semua portfolio</button><div class="card"><h2>${esc(p.portfolio_name)}</h2><div class="subtitle">Pengerusi: ${esc(p.chairperson||'Belum ditetapkan')}</div><div class="subtitle">AJK: ${esc(p.members||'Belum ditetapkan')}</div><div class="row"><span>${totals(selected).done}/${totals(selected).all} selesai</span><strong>${pct(selected)}%</strong></div>${bar(pct(selected))}</div>${selectedPhase?phaseTasks(p):`<h3>Pilih Fasa Tugasan</h3><div class="phase-grid">${PHASES.map(ph=>`<button class="phase-card" onclick="selectedPhase='${ph}';render()"><strong>${ph}</strong><small>${totals(selected,ph).all} tugasan</small><span>${pct(selected,ph)}% selesai →</span></button>`).join('')}</div>`}`}
function portfolioCards(q){q=q.toLowerCase();return state.portfolios.filter(p=>(p.portfolio_name+' '+p.members).toLowerCase().includes(q)).map(p=>`<div class="card" onclick="openPortfolio('${p.portfolio_id}')"><div class="row"><div><strong>${esc(p.portfolio_name)}</strong><div class="subtitle">${esc(p.members||'Belum ditetapkan')}</div></div><strong>${pct(p.portfolio_id)}% ›</strong></div>${bar(pct(p.portfolio_id))}</div>`).join('')||'<div class="empty">Tiada portfolio ditemui.</div>'}function filterPortfolios(q){$('portfolioList').innerHTML=portfolioCards(q)}
function phaseTasks(p){return `<button class="back" onclick="selectedPhase=null;render()">← Pilih fasa</button><div class="row"><h3>Tugasan ${selectedPhase}</h3><button class="primary" onclick="taskDialog()">+ Tambah Tugasan</button></div><div class="toolbar"><input id="taskSearch" placeholder="Cari tugasan…" oninput="filterTaskList()"><select id="taskStatus" onchange="filterTaskList()"><option value="">Semua status</option><option value="open">Belum Selesai</option><option value="done">Selesai</option></select></div><div id="taskList">${taskCards('','')}</div>`}
function taskCards(q='',f=''){q=q.toLowerCase();let rows=state.tasks.filter(t=>t.portfolio_id===selected&&t.phase===selectedPhase&&t.task_description.toLowerCase().includes(q)&&(!f||(f==='done')===t.completed));return rows.map(t=>`<article class="task"><div class="row task-row"><div class="task-title">${esc(t.task_description)}</div><label class="tick"><input type="checkbox" ${t.completed?'checked':''} onchange="toggleStatus('${t.task_id}',this.checked)"><span>${t.completed?'Selesai':'Belum Selesai'}</span></label></div><div class="actions"><button class="small" onclick="noteDialog('${t.task_id}')">Catatan${t.notes?' ✓':''}</button><button class="small" onclick="taskDialog('${t.task_id}')">Edit Tugasan</button></div>${t.notes?`<div class="note">${esc(t.notes)}</div>`:''}</article>`).join('')||'<div class="empty">Tiada tugasan untuk fasa ini.</div>'}function filterTaskList(){$('taskList').innerHTML=taskCards($('taskSearch').value,$('taskStatus').value)}
async function toggleStatus(id,value){let t=state.tasks.find(x=>x.task_id===id);try{let updated=await api('updateTask',{task_id:id,version:t.version,changes:{completed:value}});Object.assign(t,updated);render()}catch(e){alert(e.code==='VERSION_CONFLICT'?'Tugasan telah dikemas kini oleh pengguna lain. Data akan disegar semula.':e.message);await load(true)}}
function dialog(title,body,save){editing=true;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalSave').onclick=async()=>{try{await save();modal.close();editing=false;render()}catch(e){alert(e.code==='VERSION_CONFLICT'?'Versi baharu ditemui. Segar semula sebelum mencuba lagi.':e.message)}};modal.onclose=()=>{editing=false};modal.showModal()}
function taskDialog(id){let t=id?state.tasks.find(x=>x.task_id===id):null;dialog(t?'Edit Tugasan':'Tambah Tugasan',`<label>Perihal tugasan</label><textarea id="taskText" maxlength="1500">${esc(t?.task_description||'')}</textarea>`,async()=>{let text=$('taskText').value.trim();if(!text)throw Error('Masukkan perihal tugasan.');let updated=t?await api('updateTask',{task_id:t.task_id,version:t.version,changes:{task_description:text}}):await api('createTask',{portfolio_id:selected,phase:selectedPhase,task_description:text});if(t)Object.assign(t,updated);else state.tasks.push(updated)})}
function noteDialog(id){let t=state.tasks.find(x=>x.task_id===id);dialog('Catatan',`<label>Catatan tugasan</label><textarea id="noteText" maxlength="5000">${esc(t.notes||'')}</textarea>`,async()=>Object.assign(t,await api('updateTask',{task_id:id,version:t.version,changes:{notes:$('noteText').value.trim()}})))}
function renderReport(){let filter=$('reportPortfolio')?.value||'';let ps=filter?state.portfolios.filter(p=>p.portfolio_id===filter):state.portfolios;let t=totals(filter||null);$('report').innerHTML=`<div class="row"><h2>Laporan</h2><button class="primary small" onclick="copyReport()">Salin Laporan</button></div><select id="reportPortfolio" class="report-filter" onchange="renderReport()"><option value="">Semua portfolio</option>${state.portfolios.map(p=>`<option value="${p.portfolio_id}" ${filter===p.portfolio_id?'selected':''}>${esc(p.portfolio_name)}</option>`).join('')}</select><div class="card"><div class="row"><strong>Keseluruhan</strong><strong>${pct(filter||null)}%</strong></div><p>${t.done} selesai · ${t.not} belum selesai · ${t.all} jumlah</p>${bar(pct(filter||null))}</div>${ps.map(p=>`<div class="card"><div class="row"><strong>${esc(p.portfolio_name)}</strong><strong>${pct(p.portfolio_id)}%</strong></div>${bar(pct(p.portfolio_id))}${PHASES.map(ph=>{let s=totals(p.portfolio_id,ph);return `<div class="row" style="margin-top:10px"><span><span class="phase-tag">${ph}</span> ${s.done}/${s.all} selesai</span><strong>${pct(p.portfolio_id,ph)}%</strong></div>`}).join('')}<details><summary style="margin-top:12px">Lihat tugasan</summary>${tasksFor(p.portfolio_id).map(t=>`<div class="task"><div>${t.completed?'☑':'☐'} ${esc(t.task_description)}</div>${t.notes?`<div class="note">${esc(t.notes)}</div>`:''}</div>`).join('')}</details></div>`).join('')}`}
function reportText(){let f=$('reportPortfolio')?.value||'';let ps=f?state.portfolios.filter(p=>p.portfolio_id===f):state.portfolios,t=totals(f||null),lines=['LAPORAN KEMAJUAN i-CSR 2026','Tarikh persidangan: 8 Disember 2026',`Kemajuan: ${pct(f||null)}% (${t.done}/${t.all} selesai)`,''];ps.forEach(p=>{let s=totals(p.portfolio_id);lines.push(`${p.portfolio_name}: ${pct(p.portfolio_id)}% (${s.done}/${s.all})`);PHASES.forEach(ph=>{let x=totals(p.portfolio_id,ph);lines.push(`  ${ph}: ${x.done}/${x.all} selesai`)});});return lines.join('\n')}async function copyReport(){let text=reportText();try{await navigator.clipboard.writeText(text);alert('Laporan telah disalin.')}catch{dialog('Salin Laporan',`<textarea id="copyText">${esc(text)}</textarea>`,async()=>{});$('copyText').select()}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('syncBtn').onclick=()=>{connection.failures=0;load(true);if(page==='registration')loadRegistration()};window.addEventListener('online',()=>{connection.connected=false;connection.failures=0;load(false)});window.addEventListener('offline',()=>{connection.connected=false;status('offline','Tiada sambungan internet.')});state.timer=setInterval(()=>load(false),CONFIG.REFRESH_MS);load(true);loadRegistration();
</script></body></html>

","tasks":[{"title":"Kenal pasti kumpulan sasaran dan saluran hebahan seperti e-mel, WhatsApp, Telegram dan media sosial.","status":"Belum Selesai","notes":[],"phase":"Sebelum"},{"title":"Sediakan jadual hebahan dari pembukaan penyertaan hingga hari program.","status":"Belum Selesai","notes":[],"phase":"Sebelum"},{"title":"Sediakan ayat hebahan yang jelas tentang tema, tarikh, yuran, syarat, pautan dan nombor untuk dihubungi.","status":"Belum Selesai","notes":[],"phase":"Sebelum"},{"title":"Hebahkan panggilan kertas kerja, tarikh penting, penceramah, anugerah dan peringatan pendaftaran.","status":"Belum Selesai","notes":[],"phase":"Sebelum"},{"title":"Gunakan hanya maklumat rasmi yang telah disahkan oleh Setiausaha dalam setiap hebahan.","status":"Belum Selesai","notes":[],"phase":"Sebelum"},{"title":"Pastikan setiap hebahan mempunyai arahan yang jelas seperti daftar, hantar artikel atau lihat jadual.","status":"Belum Selesai","notes":[],"phase":"Sebelum"},{"title":"Buat liputan langsung melalui gambar, tangkapan skrin, kapsyen dan berita ringkas.","status":"Belum Selesai","notes":[],"phase":"Semasa"},{"title":"Siarkan bahan penaja yang telah disahkan oleh Jawatankuasa Penajaan dan disediakan oleh Poster dan Infografik.","status":"Belum Selesai","notes":[],"phase":"Semasa"},{"title":"Umumkan keputusan pemenang hanya selepas menerima senarai rasmi yang diluluskan oleh Pengarah Projek.","status":"Belum Selesai","notes":[],"phase":"Selepas"},{"title":"Terbitkan ucapan penghargaan, montaj dan pautan prosiding apabila diluluskan.","status":"Belum Selesai","notes":[],"phase":"Selepas"},{"title":"Sediakan laporan jumlah hebahan, capaian, tontonan dan penglibatan pengguna.","status":"Belum Selesai","notes":[],"phase":"Selepas"}]},{"name":"POSTER DAN INFOGRAFIK","tasks":[{"title":"Tetapkan warna, fon, logo dan gaya visual yang akan digunakan dalam semua bahan program.","status":"Belum Selesai","notes":[],"phase":"Sebelum"},{"title":"Sediakan poster utama yang memaparkan tari function renderDash(){let t=totals();$('dashboard').innerHTML=`<h2 class="section-title">Dashboard</h2><div class="card"><div class="row"><div><div class="muted">Kemajuan keseluruhan</div><strong style="font-size:34px">${percent()}%</strong></div><div class="top-count">${t.done} / ${t.all} tugasan selesai</div></div>${progressBar(percent())}</div><div class="grid">${[['Jumlah',t.all],['Selesai',t.done],['Belum Selesai',t.not]].map(([a,b])=>`<div class="card metric"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('')}</div><h3>Kemajuan portfolio</h3>${data.map((p,i)=>`<div class="card" onclick="openPortfolio(${i})" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openPortfolio(${i})"><div class="row"><div><strong>${esc(p.name)}</strong><div class="subtitle">${esc(p.members||'Belum ditetapkan')}</div><div class="subtitle">${totals(p).done} / ${totals(p).all} selesai</div></div><strong>${percent(p)}% ›</strong></div>${progressBar(percent(p))}</div>`).join('')}`}

function dialog(title,body,onSave){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalSave').onclick=()=>{if(onSave()!==false)$('modal').close()};$('modal').showModal()}function addPortfolio(){dialog('Tambah Portfolio','<label>Nama portfolio</label><input id="nameInput" maxlength="120"><label>Nama AJK</label><textarea id="memberInput"></textarea>',()=>{let v=$('nameInput').value.trim();if(!v)return alert('Masukkan nama portfolio.'),false;data.push({name:v,members:$('memberInput').value.trim(),tasks:[]});save()})}function editPortfolio(i){dialog('Edit Portfolio',`<label>Nama portfolio</label><input id="nameInput" maxlength="120" value="${esc(data[i].name)}"><label>Nama AJK</label><textarea id="memberInput">${esc(data[i].members||'')}</textarea>`,()=>{let v=$('nameInput').value.trim();if(!v)return alert('Masukkan nama portfolio.'),false;data[i].name=v;data[i].members=$('memberInput').value.trim();save()})}function taskForm(i,j){let t=j===undefined?{title:'',status:'Belum Selesai',phase:selectedPhase||'Sebelum'}:data[i].tasks[j];dialog(j===undefined?'Tambah Tugasan':'Edit Tugasan',`<label>Nama tugasan</label><textarea id="taskTitle" maxlength="1000">${esc(t.title)}</textarea><label>Fasa</label><select id="taskPhase">${PHASES.map(ph=>`<option ${t.phase===ph?'selected':''}>${ph}</option>`).join('')}</select>`,()=>{let v=$('taskTitle').value.trim();if(!v)return alert('Masukkan nama tugasan.'),false;if(j===undefined)data[i].tasks.push({title:v,phase:$('taskPhase').value,status:t.status==='Selesai'?'Selesai':'Belum Selesai',notes:[]});else Object.assign(data[i].tasks[j],{title:v,phase:$('taskPhase').value,status:t.status==='Selesai'?'Selesai':'Belum Selesai'});save()})}function noteForm(i,j,k){let n=k===undefined?'':data[i].tasks[j].notes[k];dialog(k===undefined?'Tambah Catatan':'Edit Catatan',`<label>Catatan</label><textarea id="noteText" maxlength="5000">${esc(n)}</textarea>`,()=>{let v=$('noteText').value.trim();if(!v)return alert('Masukkan catatan.'),false;if(k===undefined)data[i].tasks[j].notes.push(v);else data[i].tasks[j].notes[k]=v;expanded[i+'-'+j]=true;save()})}function deleteNote(i,j,k){if(confirm('Padam catatan ini?')){data[i].tasks[j].notes.splice(k,1);save()}}
function reportText(){let t=totals();let lines=['LAPORAN KEMAJUAN i-CSR 2026','Persidangan: 8 Disember 2026','',`Kemajuan keseluruhan: ${percent()}%`,`Jumlah tugasan: ${t.all}`,`Selesai: ${t.done} | Belum Selesai: ${t.not}`,''];data.forEach(p=>{let s=totals(p);lines.push(`${p.name} — ${percent(p)}% (${s.done}/${s.all} selesai)`);p.tasks.forEach(t=>{lines.push(`• [${t.status}] ${t.title}`);(t.notes||[]).forEach(n=>lines.push(`    Catatan: ${n}`))});lines.push('')});return lines.join('\n')}function renderReport(){let t=totals();$('report').innerHTML=`<h2 class="section-title">Laporan Kemajuan</h2><div class="card"><div class="row"><strong>Ringkasan</strong><button class="primary small" onclick="copyReport()">Salin Laporan</button></div><p>Keseluruhan: <strong>${percent()}%</strong> · ${t.done}/${t.all} tugasan selesai</p>${progressBar(percent())}</div>${data.map(p=>`<div class="card"><div class="row"><strong>${esc(p.name)}</strong><strong>${percent(p)}%</strong></div><div class="subtitle">${totals(p).done} selesai · ${totals(p).not} belum selesai</div>${progressBar(percent(p))}<details style="margin-top:12px"><summary>Lihat tugasan dan catatan</summary>${p.tasks.map(t=>`<div class="task"><div class="row"><span>${esc(t.title)}</span>${badge(t.status)}</div>${(t.notes||[]).map(n=>`<div class="note tiny">${esc(n)}</div>`).join('')}</div>`).join('')||'<p class="muted">Tiada tugasan.</p>'}</details></div>`).join('')}<div class="card"><h3>Sandaran Data</h3><p class="muted">Data hanya disimpan pada pelayar ini. Simpan fail sandaran jika mahu memindahkan data atau mengelakkan kehilangan rekod.</p><div class="actions"><button onclick="backup()">Simpan Sandaran</button><button onclick="$('restoreInput').click()">Pulihkan Sandaran</button><input class="hidden" type="file" accept="application/json,.json" id="restoreInput" onchange="restore(event)"></div></div>`}async function copyReport(){let v=reportText();try{await navigator.clipboard.writeText(v);alert('Laporan telah disalin.')}catch(e){dialog('Salin Laporan',`<textarea id="copyArea">${esc(v)}</textarea>`,()=>true);$('copyArea').select()}}function backup(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='icsr-tasktrack-sandaran.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d)||!d.every(p=>typeof p.name==='string'&&Array.isArray(p.tasks)&&p.tasks.every(t=>typeof t.title==='string'&&['Belum Mula','Dalam Proses','Belum Selesai','Selesai'].includes(t.status)&&Array.isArray(t.notes)&&t.notes.every(n=>typeof n==='string'))))throw Error();if(confirm('Gantikan semua data semasa dengan sandaran ini?')){data=d;save()}}catch(err){alert('Fail sandaran tidak sah.')}e.target.value=''};r.readAsText(f)}const PHASES=['Sebelum','Semasa','Selepas'];let selectedPhase=null;data.forEach(p=>{const original=INITIAL.find(x=>x.name===p.name);p.tasks.forEach(t=>{if(!PHASES.includes(t.phase)){const match=original?.tasks.find(x=>x.title===t.title);t.phase=match?.phase||'Sebelum'}})});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));try{render()}catch(e){document.getElementById('dashboard').innerHTML='<h2>Dashboard</h2><p>Ralat paparan: '+String(e.message)+'</p>';console.error(e)}
</script></body></html>
